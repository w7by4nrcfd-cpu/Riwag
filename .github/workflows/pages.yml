# Builds, tests, then publishes the site to GitHub Pages under /<repo-name>/ on every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and test (root paths)
        run: npm run build && npm test
      - name: Build for GitHub Pages sub-path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - name: Build client previews (clients/<slug> -> /c/<slug>/)
        run: |
          for d in clients/*/; do
            slug=$(basename "$d")
            CLIENT=$slug OUT_DIR=dist-client BASE_PATH=/${{ github.event.repository.name }}/c/$slug npm run build
            mkdir -p dist/c && rm -rf "dist/c/$slug" && mv dist-client "dist/c/$slug"
          done
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
